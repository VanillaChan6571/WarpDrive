buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.77', changing: false
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'

// Load properties
ext.configFile = file "build.properties"
configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    ext.config = new ConfigSlurper().parse prop
}

group = 'cr0s.warpdrive'
version = "${config.minecraft_version}-${config.mod_version}.${System.getenv('BUILD_NUMBER') ?: 'SNAPSHOT'}"
archivesBaseName = 'WarpDrive'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'official', version: config.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                warpdrive {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                warpdrive {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'warpdrive', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                warpdrive {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    // CC:Tweaked
    maven {
        name = "SquidDev"
        url = "https://squiddev.cc/maven/"
    }

    // Applied Energistics 2
    maven {
        name = "Modmaven"
        url = "https://modmaven.dev/"
    }

    // JEI
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }

    // Curse Maven (for mods not on other repos)
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${config.minecraft_version}-${config.forge_version}"

    // CC:Tweaked for 1.16.5
    compileOnly fg.deobf("org.squiddev:cc-tweaked-${config.minecraft_version}:${config.CCTweaked_version}")
    runtimeOnly fg.deobf("org.squiddev:cc-tweaked-${config.minecraft_version}:${config.CCTweaked_version}")

    // Applied Energistics 2 for 1.16.5 (commented out until we reach Phase 4)
    // compileOnly fg.deobf("appeng:appliedenergistics2:${config.AE2_version}")
    // runtimeOnly fg.deobf("appeng:appliedenergistics2:${config.AE2_version}")

    // JEI for reference/testing
    // compileOnly fg.deobf("mezz.jei:jei-${config.minecraft_version}:${config.JEI_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${config.minecraft_version}:${config.JEI_version}")
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', config.minecraft_version

    // skip source assets
    exclude '**/*.pdn'
    exclude '**/*.psd'

    // Process mods.toml
    from(sourceSets.main.resources.srcDirs) {
        include 'META-INF/mods.toml'

        expand 'version': project.version, 'mcversion': config.minecraft_version
    }

    // copy everything else
    from(sourceSets.main.resources.srcDirs) {
        exclude 'META-INF/mods.toml'
        exclude 'mcmod.info' // Old format, no longer used
    }
}

// Lua script copying tasks (keep for now, may need adjustment)
task copyShipControllerCommons1(type: Copy) {
    from 'src/main/resources/assets/warpdrive/lua.ComputerCraft/warpdriveShipController'
    into('build/resources/main/assets/warpdrive/lua.ComputerCraft/warpdriveShipCore')
}

task copyShipControllerCommons2(type: Copy) {
    from 'src/main/resources/assets/warpdrive/lua.OpenComputers/warpdriveShipController'
    into('build/resources/main/assets/warpdrive/lua.OpenComputers/warpdriveShipCore')
}

task copyOpenComputersCommons1(type: Copy) {
    from 'src/main/resources/assets/warpdrive/lua.OpenComputers/common'
    into('build/resources/main/assets/warpdrive/lua.OpenComputers/warpdriveAccelerator')
}

task copyOpenComputersCommons2(type: Copy) {
    from 'src/main/resources/assets/warpdrive/lua.OpenComputers/common'
    into('build/resources/main/assets/warpdrive/lua.OpenComputers/warpdriveEnanReactorCore')
}

task copyOpenComputersCommons3(type: Copy) {
    from 'src/main/resources/assets/warpdrive/lua.OpenComputers/common'
    into('build/resources/main/assets/warpdrive/lua.OpenComputers/warpdriveShipController')
}

task copyOpenComputersCommons4(type: Copy) {
    from 'src/main/resources/assets/warpdrive/lua.OpenComputers/common'
    into('build/resources/main/assets/warpdrive/lua.OpenComputers/warpdriveShipCore')
}

task copyOpenComputersCommons5(type: Copy) {
    from 'src/main/resources/assets/warpdrive/lua.OpenComputers/common'
    into('build/resources/main/assets/warpdrive/lua.OpenComputers/warpdriveTransporterCore')
}

task copyOpenComputersCommons6(type: Copy) {
    from 'src/main/resources/assets/warpdrive/lua.OpenComputers/common'
    into('build/resources/main/assets/warpdrive/lua.OpenComputers/warpdriveWeaponController')
}

jar {
    dependsOn copyShipControllerCommons1, copyShipControllerCommons2
    dependsOn copyOpenComputersCommons1, copyOpenComputersCommons2, copyOpenComputersCommons3, copyOpenComputersCommons4, copyOpenComputersCommons5, copyOpenComputersCommons6

    manifest {
        attributes([
            "Specification-Title": "WarpDrive",
            "Specification-Vendor": "WarpDrive Team",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "WarpDrive Team"
            // Note: Removed FMLCorePlugin entries - coremods no longer supported in 1.13+
        ])
    }

    finalizedBy 'reobfJar'
}

idea {
    module {
        inheritOutputDirs = true
    }
}
