buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        // MixinGradle lives here. Mixin itself needs no runtime dependency: Forge 1.16.5 already
        // bundles the 0.8.4 subsystem and loads it through ModLauncher, so users install nothing.
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.77', changing: false
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT', changing: true
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

// Load properties
ext.configFile = file "build.properties"
configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    ext.config = new ConfigSlurper().parse prop
}

group = 'cr0s.warpdrive'
version = "${config.minecraft_version}-${config.mod_version}.${System.getenv('BUILD_NUMBER') ?: 'SNAPSHOT'}"
archivesBaseName = 'WarpDrive'

// Minecraft 1.16.5 runs on Java 8, so the mod MUST be compiled to class file version 52.
// This was previously set to 16, which produced version 60 classes: fine under `runClient`
// (a modern JVM) but rejected by a real 1.16.5 instance with
// "UnsupportedClassVersionError ... class file version 60.0 ... only recognizes up to 52.0".
// Java 16+ is required to *run* ForgeGradle 5.1 - that is org.gradle.java.home in
// gradle.properties, a separate thing from the compile target set here.
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

// The refmap is what makes a mixin work outside the dev environment. We compile against 'official'
// (Mojang) names, but a real instance runs on SRG names, so a mixin targeting tick() would resolve
// in runClient and silently find nothing in the deployed jar. The annotation processor generates
// this mapping at compile time, using the SRG data ForgeGradle already produces.
mixin {
    add sourceSets.main, 'warpdrive.refmap.json'
    config 'warpdrive.mixins.json'
}

minecraft {
    mappings channel: 'official', version: config.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                warpdrive {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                warpdrive {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'warpdrive', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                warpdrive {
                    source sourceSets.main
                }
            }
        }
    }
}

// sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    // CC:Tweaked
    maven {
        name = "SquidDev"
        url = "https://squiddev.cc/maven/"
    }

    // Applied Energistics 2
    // DISABLED: modmaven.dev answers HTTP 200 + "Content-Type: application/zip" for artifacts
    // it does not host, returning a 566-byte HTML redirect stub instead of the file. ForgeGradle
    // takes the first 200 response and caches the HTML, which later fails as
    // "zip END header not found" / "Invalid patcher dependency". Re-enable only when AE2 is
    // actually needed (Phase 4), and put it AFTER maven.minecraftforge.net if so.
    // maven {
    //     name = "Modmaven"
    //     url = "https://modmaven.dev/"
    // }

    // JEI
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }

    // Curse Maven (for mods not on other repos)
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${config.minecraft_version}-${config.forge_version}"

    // Compile-time only: generates warpdrive.refmap.json. Forge supplies the Mixin runtime.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // CC:Tweaked for 1.16.5
    compileOnly fg.deobf("org.squiddev:cc-tweaked-${config.minecraft_version}:${config.CCTweaked_version}")
    runtimeOnly fg.deobf("org.squiddev:cc-tweaked-${config.minecraft_version}:${config.CCTweaked_version}")

	// Pure calculation tests (movement costs, deterministic generation helpers).
	testImplementation 'junit:junit:4.13.2'

    // Applied Energistics 2 for 1.16.5 (commented out until we reach Phase 4)
    // compileOnly fg.deobf("appeng:appliedenergistics2:${config.AE2_version}")
    // runtimeOnly fg.deobf("appeng:appliedenergistics2:${config.AE2_version}")

    // JEI for reference/testing
    // compileOnly fg.deobf("mezz.jei:jei-${config.minecraft_version}:${config.JEI_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${config.minecraft_version}:${config.JEI_version}")
}

// Sources are UTF-8. Without this javac uses the platform default (windows-1252 on this machine),
// which mangles the non-ASCII glyphs used in the action bar messages.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property 'version', project.version
    inputs.property 'mcversion', config.minecraft_version

    // skip source assets
    exclude '**/*.pdn'
    exclude '**/*.psd'
    exclude 'mcmod.info' // Old format
	// OpenComputers has no 1.16.5 release. Keep the legacy scripts in source for reference without
	// shipping dead payload in the 1.16 artifact.
	exclude 'assets/warpdrive/lua.OpenComputers/**'

    // Process mods.toml with variable expansion
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version, 'mcversion': config.minecraft_version
    }
}

// Lua script copying tasks (keep for now, may need adjustment)
task copyShipControllerCommons1(type: Copy) {
    from 'src/main/resources/assets/warpdrive/lua.ComputerCraft/warpdriveShipController'
    into('build/resources/main/assets/warpdrive/lua.ComputerCraft/warpdriveShipCore')
}

def luaResourceCopyTasks = [
	copyShipControllerCommons1
]

// These tasks write into the main resource output used on the test classpath. Declare that
// relationship explicitly so Gradle may safely retain parallel/incremental execution.
tasks.named('compileTestJava') { dependsOn luaResourceCopyTasks }
tasks.named('test') { dependsOn luaResourceCopyTasks }

jar {
	dependsOn luaResourceCopyTasks

    manifest {
        attributes([
            "Specification-Title": "WarpDrive",
            "Specification-Vendor": "WarpDrive Team",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "WarpDrive Team",
            // 1.16.5 Forge discovers mixin configs through this manifest attribute. The 1.12.2
            // FMLCorePlugin entries that used to live here did the same job the coremod way.
            "MixinConfigs": "warpdrive.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

// Deploy the reobfuscated jar straight into a CurseForge (or any) instance mods folder.
// Override the target with -PinstanceModsDir=... or an instance_mods_dir entry in build.properties.
ext.instanceModsDir = project.findProperty('instanceModsDir')
	?: config.instance_mods_dir
	?: "${System.getProperty('user.home')}/Documents/CurseForge/Instances/WarpDrive Development/mods"

def deployBuiltJar = {
	def target = file(instanceModsDir)
	if (!target.isDirectory()) {
		throw new GradleException("Instance mods folder not found: ${target}\n" +
			"Pass a different one with -PinstanceModsDir=\"C:/path/to/mods\"")
	}

	// Remove older WarpDrive builds so Forge doesn't load two copies.
	target.listFiles({ f -> f.name ==~ /^WarpDrive-.*\.jar$/ } as FileFilter).each {
		logger.lifecycle("Removing stale build: ${it.name}")
		if (!it.delete()) {
			throw new GradleException("Unable to remove stale build: ${it}")
		}
	}

	copy {
		from jar.archiveFile
		into target
	}
	logger.lifecycle("Deployed ${jar.archiveFileName.get()} -> ${target}")
}

task deployToInstance {
	description = 'Copies the built mod jar into the development instance mods folder'
	group = 'warpdrive'

	// reobfJar rewrites build/libs in place, so we must wait for it
	dependsOn 'reobfJar'

	doLast {
		deployBuiltJar()
	}
}

// A doLast action only runs when the complete build succeeds, so a failed compile or
// reobfuscation can never deploy a stale jar. deployToInstance remains available for
// an explicit deployment without running the full verification lifecycle again.
tasks.named('build') {
	doLast {
		deployBuiltJar()
	}
}

// Note: idea {} block removed - incompatible with Gradle 7.6
// Use 'eclipse' or 'idea' plugin configuration if needed
